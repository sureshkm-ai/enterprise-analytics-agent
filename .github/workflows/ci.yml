name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Poetry in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/poetry"
          "$RUNNER_TEMP/poetry/bin/pip" install "poetry==2.3.1"
          echo "$RUNNER_TEMP/poetry/bin" >> "$GITHUB_PATH"

      - name: Check committed lockfile
        run: poetry check --lock

      - name: Install locked dependencies
        run: poetry sync --with dev --no-interaction

      - name: Run offline tests (live suites require separate approved execution)
        run: poetry run pytest

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check types
        run: poetry run mypy src tests

      - name: Synthesize CDK without AWS lookups or credentials
        run: >-
          poetry run python -m infrastructure.cdk.app
          --config infrastructure/cdk/config.example.json
          --outdir artifacts/cdk.out

      - name: Synthesize AgentCore foundation without AWS credentials
        run: >-
          poetry run python -m infrastructure.cdk.agentcore_app
          --config infrastructure/cdk/agentcore.config.example.json
          --phase foundation --outdir artifacts/cdk.agentcore-foundation.out

      - name: Verify proposed streaming replacement templates without AWS credentials
        run: |
          poetry run python -m infrastructure.cdk.streaming_app \
            --config infrastructure/cdk/streaming.completion-fix.proposed.json \
            --outdir artifacts/cdk.streaming-completion.out --allow-unbound-artifact
          poetry run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          review = json.loads(Path("evaluations/bedrock-streaming/review.completion-fix.proposed.json").read_text())
          for target in review["targets"]:
              path = Path("artifacts/cdk.streaming-completion.out") / f"enterprise-analytics-stream-{target['model_key']}.template.json"
              template = json.loads(path.read_text())
              actual = hashlib.sha256(json.dumps(template, sort_keys=True).encode()).hexdigest()
              assert actual == target["template_sha256"], target["model_key"]
          PY
