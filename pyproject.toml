[project]
name = "enterprise-analytics-agent"
version = "0.1.0"
description = "Governed analytics with DuckDB, Athena, and a bounded Bedrock agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "pydantic>=2.12,<3",
    "boto3>=1.43,<2",
]

[project.scripts]
analytics-demo = "enterprise_analytics_agent.cli:main"
analytics-ask = "enterprise_analytics_agent.retail_evaluation.agent_cli:main"
analytics-evaluate = "enterprise_analytics_agent.retail_evaluation.runner:main"
analytics-repair = "enterprise_analytics_agent.retail_evaluation.repair_cli:main"
analytics-publish = "enterprise_analytics_agent.adapters.publication_cli:main"

[tool.poetry]
packages = [{ include = "enterprise_analytics_agent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.14,<1"
mypy = ">=1.18,<2"
aws-cdk-lib = ">=2.275,<3"
constructs = ">=10,<11"
packaging = ">=26,<27"
boto3-stubs = { version = ">=1.43,<2", extras = ["s3", "athena", "glue", "sts"] }

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "retail_live: separately approved M5 campaign (--run-retail-live)",
    "aws_integration: explicitly enabled live AWS parity tests (--run-aws)",
    "agent_live: explicitly approved billable deployed-agent evaluations (--run-agent-live)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
